<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/kiwi-icon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8F9F5" />
    <title>Kiwi</title>
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var urlTheme = params.get('theme');
          var saved = urlTheme || localStorage.getItem('kiwi_theme');
          var isDark = urlTheme === 'light' ? false : (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches));
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#121310');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8F9F5] dark:bg-[#121310] text-stone-900 dark:text-[#F3F4F1] antialiased selection:bg-kiwi-flesh/20 selection:text-kiwi-flesh-700 dark:selection:bg-kiwi-lime/30 dark:selection:text-kiwi-lime">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
